name: Build debug APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Unit tests and debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew test assembleDebug --stacktrace --no-daemon

      - name: Verify APK exists
        run: |
          APK=$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)
          if [ -z "$APK" ] || [ ! -s "$APK" ]; then
            echo "Debug APK was not produced"
            exit 1
          fi
          echo "APK_PATH=$APK"
          ls -lh "$APK"
          unzip -t "$APK" >/dev/null

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: srt-color-section-studio-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
